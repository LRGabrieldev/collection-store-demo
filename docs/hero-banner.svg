<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Collection Store — Um problema, uma solução digital">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14100E"/>
      <stop offset="55%" stop-color="#1E1714"/>
      <stop offset="100%" stop-color="#120E0C"/>
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C59B5F" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#C59B5F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A46D7A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A46D7A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFC293"/>
      <stop offset="50%" stop-color="#F3DFBC"/>
      <stop offset="100%" stop-color="#C59B5F"/>
    </linearGradient>

    <linearGradient id="shimmerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B5F" stop-opacity="0"/>
      <stop offset="45%" stop-color="#E8CFA0" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#FFF0D1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C59B5F" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="320" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Obsidian Background -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>

    <!-- Subtle Editorial Grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="600" y1="0" x2="600" y2="320"/>
      <line x1="800" y1="0" x2="800" y2="320"/>
      <line x1="1000" y1="0" x2="1000" y2="320"/>
    </g>

    <!-- Animated Ambient Glows -->
    <circle cx="930" cy="145" r="240" fill="url(#goldGlow)">
      <animate attributeName="r" values="220;255;220" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="285" r="200" fill="url(#roseGlow)">
      <animate attributeName="r" values="185;220;185" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Top Animated Gold Shimmer Beam -->
    <rect x="-400" y="0" width="400" height="2.5" fill="url(#shimmerLine)">
      <animate attributeName="x" values="-400;1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Left Content Column -->
    <!-- Status Pill -->
    <g transform="translate(56, 44)">
      <rect width="318" height="28" rx="14" fill="#231B17" stroke="#C59B5F" stroke-opacity="0.38" stroke-width="1"/>
      <circle cx="18" cy="14" r="4.5" fill="#25D366">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="14" r="8" fill="#25D366" opacity="0.25">
        <animate attributeName="r" values="4.5;10;4.5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="18.5" fill="#E6D5B8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">VITRINE DIGITAL • SHOWCASE PÚBLICO</text>
    </g>

    <!-- Brand Title -->
    <text x="56" y="128" fill="#F8F5F1" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="400" letter-spacing="-0.5">
      Collection <tspan fill="url(#goldText)" font-style="italic">Store</tspan>
    </text>

    <!-- Video Case Study Subtitle -->
    <text x="56" y="168" fill="#E2C493" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" font-weight="600">
      "Um problema, uma solução digital"
    </text>

    <!-- Concise Value Proposition -->
    <text x="56" y="202" fill="#B8AEA6" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14.5">
      Catálogo interativo com 10 departamentos, sincronização em background,
    </text>
    <text x="56" y="224" fill="#B8AEA6" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14.5">
      checkout direto no WhatsApp e painel administrativo com autenticação na borda.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(56, 252)" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="98" height="28" rx="8" fill="#241C18" stroke="#C59B5F" stroke-opacity="0.3"/>
      <text x="49" y="18" text-anchor="middle" fill="#E8D8C3">HTML / CSS</text>

      <rect x="108" y="0" width="112" height="28" rx="8" fill="#241C18" stroke="#C59B5F" stroke-opacity="0.3"/>
      <text x="164" y="18" text-anchor="middle" fill="#E8D8C3">Vanilla JS ES</text>

      <rect x="230" y="0" width="142" height="28" rx="8" fill="#241C18" stroke="#C59B5F" stroke-opacity="0.3"/>
      <text x="301" y="18" text-anchor="middle" fill="#E8D8C3">Zero Dependências</text>

      <rect x="382" y="0" width="150" height="28" rx="8" fill="#241C18" stroke="#25D366" stroke-opacity="0.45"/>
      <text x="457" y="18" text-anchor="middle" fill="#8BF0AF">WhatsApp Checkout</text>
    </g>

    <!-- Right Interactive Flow Diagram Cards -->
    <g transform="translate(748, 38)">
      <!-- Animated Dashed Flow Connector -->
      <path d="M 195 66 L 195 96 M 195 162 L 195 192" stroke="#C59B5F" stroke-width="2" stroke-dasharray="5 5" fill="none" stroke-opacity="0.7">
        <animate attributeName="stroke-dashoffset" values="20;0" dur="1.4s" repeatCount="indefinite"/>
      </path>

      <!-- Card 1: Vitrine -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="4.2s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="390" height="66" rx="14" fill="#221B17" fill-opacity="0.92" stroke="#C59B5F" stroke-opacity="0.4"/>
        <rect x="16" y="17" width="32" height="32" rx="9" fill="#C59B5F" fill-opacity="0.18" stroke="#C59B5F" stroke-opacity="0.45"/>
        <text x="32" y="38" text-anchor="middle" fill="#E2C493" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">01</text>
        <text x="62" y="29" fill="#F8F5F1" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="700">Seleção Interativa no Catálogo</text>
        <text x="62" y="48" fill="#ACA29A" font-family="'Segoe UI', sans-serif" font-size="11.5">10 departamentos • variação de preço em tempo real</text>
      </g>

      <!-- Card 2: Background Sync -->
      <g transform="translate(0, 96)">
        <animateTransform attributeName="transform" type="translate" values="0 96; 0 99; 0 96" dur="4.8s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="390" height="66" rx="14" fill="#221B17" fill-opacity="0.92" stroke="#C59B5F" stroke-opacity="0.4"/>
        <rect x="16" y="17" width="32" height="32" rx="9" fill="#C59B5F" fill-opacity="0.18" stroke="#C59B5F" stroke-opacity="0.45"/>
        <text x="32" y="38" text-anchor="middle" fill="#E2C493" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">02</text>
        <text x="62" y="29" fill="#F8F5F1" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="700">Formulário Automático em Background</text>
        <text x="62" y="48" fill="#ACA29A" font-family="'Segoe UI', sans-serif" font-size="11.5">Estado persistido via localStorage + total dinâmico</text>
      </g>

      <!-- Card 3: WhatsApp + Painel -->
      <g transform="translate(0, 192)">
        <animateTransform attributeName="transform" type="translate" values="0 192; 0 189; 0 192" dur="4.2s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="390" height="66" rx="14" fill="#1D2620" fill-opacity="0.94" stroke="#25D366" stroke-opacity="0.5"/>
        <rect x="16" y="17" width="32" height="32" rx="9" fill="#25D366" fill-opacity="0.18" stroke="#25D366" stroke-opacity="0.55"/>
        <text x="32" y="38" text-anchor="middle" fill="#68F09B" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">03</text>
        <text x="62" y="29" fill="#F8F5F1" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="700">Envio WhatsApp + Painel Admin</text>
        <text x="62" y="48" fill="#9BD7AF" font-family="'Segoe UI', sans-serif" font-size="11.5">Mensagem estruturada • Export JSON no modo demo</text>
      </g>
    </g>

    <!-- Outer Subtle Gold Border -->
    <rect x="1" y="1" width="1198" height="318" rx="22" ry="22" fill="none" stroke="#C59B5F" stroke-opacity="0.32" stroke-width="1.5"/>
  </g>
</svg>
